name: Dynamic Google Scholar Sync

on:
  schedule:
    # Runs every day at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual 1-click execution from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-scholar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Google Scholar Synchronization
        run: |
          python scripts/update_scholar.py

      - name: Commit and Push Changes If Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add website/assets/js/publications-data.js website/index.html index.html
          if git diff --staged --quiet; then
            echo "No citation changes or new papers detected from Google Scholar."
          else
            git commit -m "chore: auto-sync Google Scholar citations & metrics [skip ci]"
            git push
            echo "Successfully updated and pushed new Scholar metrics!"
          fi

